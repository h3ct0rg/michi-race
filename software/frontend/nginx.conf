# Nginx: sirve el cliente y reenvía la API y SignalR al contenedor del backend.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Esquema público: detrás de un proxy con HTTPS (p. ej. Nginx Proxy Manager) llega en X-Forwarded-Proto
map $http_x_forwarded_proto $public_scheme {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream michi_backend {
    server michiracer-backend:8080;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # SignalR (WebSocket): conexiones largas, sin buffering
    location /hubs/ {
        proxy_pass http://michi_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://michi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # archivos con hash de Vite: cache larga
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # imágenes para la vista previa al compartir
    location /og/ {
        try_files $uri =404;
        expires 1d;
        add_header Cache-Control "public";
    }

    # Link de invitación: index.html con la vista previa de la sala (WhatsApp y compañía no ejecutan JS,
    # solo leen los <meta>, así que se reescriben aquí).
    location ~ "^/room/(?<room_code>[A-Za-z0-9-]{1,20})/?$" {
        set $invite_code $room_code;
        rewrite ^ /index.html break;
        add_header Cache-Control "no-cache";
        sub_filter_once off;
        sub_filter '__ORIGIN__' '$public_scheme://$http_host';
        sub_filter '__PATH__' '$request_uri';
        sub_filter 'Michi Racer · Carreras de michis multijugador' '🏁 ¡Te invitaron a una carrera! · Sala $invite_code';
        sub_filter 'Carreras arcade de michis en pixel art. Crea una sala, comparte el link y corre con hasta 20 amigos desde el navegador, sin cuentas.' 'Únete a la sala $invite_code de Michi Racer y corre en kart con michis en pixel art. Toca el link para entrar a la parrilla: es gratis, sin cuentas y desde el navegador.';
        sub_filter '/og/michi-racer.png' '/og/michi-racer-invite.png';
    }

    # SPA: cualquier otra ruta del cliente carga index.html (con la vista previa general del juego)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        sub_filter_once off;
        sub_filter '__ORIGIN__' '$public_scheme://$http_host';
        sub_filter '__PATH__' '$request_uri';
    }
}
